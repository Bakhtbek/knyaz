<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Верификация лица</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e1e24;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
        }
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 4px solid #333;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #result-box {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            background-color: #333;
        }
        .success { background-color: #2ec4b6 !important; color: white; box-shadow: 0 0 15px #2ec4b6; }
        .error { background-color: #e71d36 !important; color: white; box-shadow: 0 0 15px #e71d36; }
        #status { margin-bottom: 10px; color: #ff9f1c; font-size: 18px; }
    </style>
</head>
<body>

    <div id="status">Загрузка системы распознавания...</div>
    
    <div class="container">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <div id="result-box">Ожидание...</div>

    <script>
        const video = document.getElementById('video');
        const statusDiv = document.getElementById('status');
        const resultBox = document.getElementById('result-box');

        // Модели загружаем из открытого CDN
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        
        let referenceDescriptor = null; // Здесь будет храниться цифровой слепок лица из файла фото.jpg
        let faceMatcher = null;

        async function init() {
            try {
                statusDiv.innerText = "1. Загрузка ИИ-моделей...";
                // Для сравнения лиц нужны три эти модели:
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                statusDiv.innerText = "2. Анализ файла фото.jpg...";
                await loadReferenceImage();

                statusDiv.innerText = "3. Включение камеры...";
                startVideo();
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Ошибка инициализации. Проверьте, лежит ли фото.jpg рядом с файлом HTML.";
            }
        }

        // Функция загрузки и сканирования вашего эталонного фото
        async function loadReferenceImage() {
            // Загружаем картинку "фото.jpg" из папки с проектом
            const img = await faceapi.fetchImage('фото.jpg');
            
            // Находим лицо на фото и считаем его дескриптор (цифровой отпечаток)
            const detections = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
            
            if (!detections) {
                throw new Error("Лицо на фотографии 'фото.jpg' не обнаружено!");
            }
            
            // Сохраняем отпечаток лица. Метка "Я" — имя объекта для сравнения.
            referenceDescriptor = detections.descriptor;
            faceMatcher = new faceapi.FaceMatcher(new faceapi.LabeledFaceDescriptors("Я", [referenceDescriptor]), 0.55); 
            // 0.55 — это порог строгости (чем ниже, тем строже проверка). 
        }

        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: {} })
                .then(stream => {
                    video.srcObject = stream;
                    statusDiv.innerText = "Система готова. Сравнение запущено.";
                })
                .catch(err => {
                    statusDiv.innerText = "Ошибка: нет доступа к веб-камере.";
                });
        }

        // Запуск постоянного сравнения при старте видеопотока
        video.addEventListener('play', () => {
            setInterval(async () => {
                // Сканируем текущий кадр с веб-камеры
                const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
                
                if (detections.length === 0) {
                    resultBox.innerText = "Лицо не видно";
                    resultBox.className = "";
                    return;
                }

                let isMeFound = false;

                // Перебираем все лица, которые видит камера (если их несколько)
                for (const detection of detections) {
                    // Сравниваем лицо из камеры с лицом из файла фото.jpg
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    
                    if (match.label === "Я") {
                        isMeFound = true;
                        break; // Если нашли себя, прерываем проверку кадра
                    }
                }

                // Выводим вердикт на экран
                if (isMeFound) {
                    resultBox.innerText = "Успешно";
                    resultBox.className = "success";
                } else {
                    resultBox.innerText = "Отказ";
                    resultBox.className = "error";
                }

            }, 400); // Проверка выполняется каждые 400 миллисекунд
        });

        // Запуск программы
        init();
    </script>
</body>
</html>
